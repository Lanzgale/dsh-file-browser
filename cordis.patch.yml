# dsh-file-browser bundle patch: mounts the file-browser plugin into the
# host composition of a dsh profile. The host half registers the
# /plugins/file-browser/* HTTP routes (list / search / read / write /
# open-vscode); the web client (dsh.client entry) renders the right-side
# resizable file-browser panel in shell.overlay plus the session-header
# toggle button.
#
# Install: `dsh plugin --profile <name> add <this package>` (npm or a local
# path). The `dsh plugin` command pnpm-installs the package into the profile
# and reconciles it into the profile's `dsh.profile.bundles` layer list.
- insert:
    - id: file-browser
      name: dsh-file-browser
